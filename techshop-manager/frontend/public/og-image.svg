<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A1628"/>
      <stop offset="60%"  stop-color="#1a3260"/>
      <stop offset="100%" stop-color="#0f3320"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- Green accent dot -->
  <circle cx="96" cy="196" r="6" fill="#22c55e" opacity="0.9"/>

  <!-- Eyebrow -->
  <text x="116" y="203" font-family="system-ui, sans-serif" font-size="22"
        font-weight="600" letter-spacing="4" fill="rgba(255,255,255,0.45)">PROGRESS BUSINESS · RDC</text>

  <!-- Main title -->
  <text x="96" y="330" font-family="Georgia, serif" font-size="92"
        font-weight="900" fill="#ffffff" letter-spacing="-2">La gestion</text>
  <text x="96" y="428" font-family="Georgia, serif" font-size="92"
        font-weight="900" fill="#ffffff" letter-spacing="-2">commerciale</text>
  <text x="96" y="526" font-family="Georgia, serif" font-size="92"
        font-weight="900" font-style="italic" fill="#3b82f6" letter-spacing="-2">en ordre.</text>

  <!-- Right side badges -->
  <rect x="820" y="200" width="300" height="52" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="970" y="233" font-family="system-ui, sans-serif" font-size="18" font-weight="600"
        fill="rgba(255,255,255,0.7)" text-anchor="middle">Goma · Bukavu · Kinshasa</text>

  <rect x="820" y="268" width="300" height="52" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="970" y="301" font-family="system-ui, sans-serif" font-size="18" font-weight="600"
        fill="rgba(255,255,255,0.7)" text-anchor="middle">POS · Stocks · Fidélité</text>

  <rect x="820" y="336" width="300" height="52" rx="8" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <circle cx="851" cy="362" r="5" fill="#22c55e"/>
  <text x="872" y="367" font-family="system-ui, sans-serif" font-size="18" font-weight="600"
        fill="#4ade80">Hors-ligne natif</text>
</svg>
